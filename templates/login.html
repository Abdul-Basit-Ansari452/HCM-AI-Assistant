{% extends "base.html" %}

{% block title %}Sign in · HRMS{% endblock %}
{% block page_id %}login{% endblock %}
{% block nav %}{% endblock %}

{% block content %}
<section class="login-shell">
  <form class="card login-card" id="login-form">
    <div class="login-brand">
      <span class="brand-mark brand-mark-large" aria-hidden="true">H</span>
      <span class="brand-copy">
        <span class="brand-name">HRMS</span>
        <span class="brand-caption">People operations</span>
      </span>
    </div>

    <h1>Welcome back</h1>
    <p class="login-subtitle">Sign in to manage your team and leave.</p>

    <div class="form-field">
      <label for="username">Email</label>
      <input
        id="username"
        name="username"
        type="email"
        autocomplete="username"
        required
        autofocus
      >
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >
    </div>

    <button class="btn btn-primary btn-block" id="login-button" type="submit">
      Sign in
    </button>
  </form>
</section>
{% endblock %}
